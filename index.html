<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Tap Tempo Pro</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tap Tempo">
  
  <!-- Web App Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">

  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    #canvas-wrapper {
      flex: 1;
      width: 100%;
      background-color: var(--panel-bg);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-panel {
      background-color: var(--panel-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .selector-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      background: #334155;
      border: 2px solid transparent;
      color: var(--text-main);
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn.active {
      background: #0284c7;
      border-color: var(--accent-color);
      color: #ffffff;
    }

    .description {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.3;
      min-height: 2.6em;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>Tap Tempo Pro</h1>
    </header>

    <div id="canvas-wrapper">
      <canvas id="tapCanvas"></canvas>
    </div>

    <div class="controls-panel">
      <div class="selector-label">Averaging Window</div>
      <div class="btn-group">
        <button class="btn" data-window="4">4 Taps</button>
        <button class="btn active" data-window="8">8 Taps</button>
        <button class="btn" data-window="16">16 Taps</button>
      </div>
      <div class="description" id="modeDescription">
        8 Taps: Balanced responsiveness and stability for general use.
      </div>
    </div>

    <footer>
      Press Spacebar or Tap Screen
    </footer>
  </div>

  <script>
    // Service Worker Registration for PWA Compliance
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.error('ServiceWorker registration failed: ', err);
        });
      });
    }

    // Canvas Application Logic
    const canvas = document.getElementById('tapCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvas-wrapper');
    const modeDesc = document.getElementById('modeDescription');
    const buttons = document.querySelectorAll('.btn');

    let maxIntervals = 8;
    let tapTimes = [];
    let bpm = 0;
    let avgMs = 0;
    let autoResetTimer = null;
    const AUTO_RESET_DELAY = 3000;

    const descriptions = {
      4: "4 Taps: Maximum responsiveness for fast tempo changes.",
      8: "8 Taps: Balanced responsiveness and stability for general use.",
      16: "16 Taps: Maximum accuracy for steady tempos, filtering out human jitter."
    };

    function getTempoMarking(bpm) {
      if (bpm <= 0) return "";
      if (bpm < 40) return "Grave";
      if (bpm < 60) return "Largo";
      if (bpm < 66) return "Larghetto";
      if (bpm < 76) return "Adagio";
      if (bpm < 108) return "Andante";
      if (bpm < 120) return "Moderato";
      if (bpm < 156) return "Allegro";
      if (bpm < 176) return "Vivace";
      if (bpm < 200) return "Presto";
      return "Prestissimo";
    }

    function resizeCanvas() {
      const rect = wrapper.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      render();
    }

    function render() {
      const width = wrapper.clientWidth;
      const height = wrapper.clientHeight;

      ctx.clearRect(0, 0, width, height);

      // Background
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, width, height);

      if (tapTimes.length < 2) {
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#94a3b8";
        ctx.font = "600 1.2rem -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(tapTimes.length === 0 ? "TAP HERE OR PRESS SPACE" : "TAP AGAIN TO START", width / 2, height / 2);
        return;
      }

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const bpmText = Math.round(bpm).toString();
      const fontSize = Math.min(width * 0.30, height * 0.35);
      const centerY = height / 2;

      // 1. Numero BPM
      ctx.fillStyle = "#f8fafc";
      ctx.font = `700 ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.fillText(bpmText, width / 2, centerY - fontSize * 0.35);

      // 2. Etichetta BPM
      ctx.fillStyle = "#38bdf8";
      ctx.font = `600 ${fontSize * 0.22}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.fillText("BPM", width / 2, centerY + fontSize * 0.25);

      // 3. Agogica
      const marking = getTempoMarking(bpm);
      ctx.fillStyle = "#94a3b8";
      ctx.font = `500 ${fontSize * 0.16}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.fillText(marking, width / 2, centerY + fontSize * 0.45);

      // 4. Intervallo in Millisecondi (ms)
      const msText = `${Math.round(avgMs)} ms`;
      ctx.fillStyle = "#64748b";
      ctx.font = `500 ${fontSize * 0.12}px -apple-system, BlinkMacSystemFont, sans-serif`;
      ctx.fillText(msText, width / 2, centerY + fontSize * 0.62);

      // Progress bar (taps count)
      const barHeight = 6;
      const intervalsCount = tapTimes.length - 1;
      const progress = Math.min(intervalsCount / maxIntervals, 1);
      
      ctx.fillStyle = "#334155";
      ctx.fillRect(0, height - barHeight, width, barHeight);

      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(0, height - barHeight, width * progress, barHeight);
    }

    function handleTap(e) {
      if (e) e.preventDefault();

      const now = performance.now();

      if (autoResetTimer) {
        clearTimeout(autoResetTimer);
      }

      tapTimes.push(now);

      if (tapTimes.length - 1 > maxIntervals) {
        tapTimes.shift();
      }

      if (tapTimes.length >= 2) {
        let totalInterval = 0;
        for (let i = 1; i < tapTimes.length; i++) {
          totalInterval += (tapTimes[i] - tapTimes[i - 1]);
        }
        avgMs = totalInterval / (tapTimes.length - 1);
        bpm = 60000 / avgMs;
      }

      autoResetTimer = setTimeout(() => {
        resetTap();
      }, AUTO_RESET_DELAY);

      render();
    }

    function resetTap() {
      tapTimes = [];
      bpm = 0;
      avgMs = 0;
      if (autoResetTimer) {
        clearTimeout(autoResetTimer);
        autoResetTimer = null;
      }
      render();
    }

    wrapper.addEventListener('pointerdown', handleTap);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        if (e.repeat) return;
        handleTap(e);
      }
    });

    buttons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        maxIntervals = parseInt(btn.dataset.window, 10);
        modeDesc.textContent = descriptions[maxIntervals];
        resetTap();
      });
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
