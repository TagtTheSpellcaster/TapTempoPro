<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Tap Tempo Pro</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 16px;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    #canvas-wrapper {
      flex: 1;
      width: 100%;
      background-color: var(--panel-bg);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls-panel {
      background-color: var(--panel-bg);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .selector-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      background: #334155;
      border: 2px solid transparent;
      color: var(--text-main);
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn.active {
      background: #0284c7;
      border-color: var(--accent-color);
      color: #ffffff;
    }

    .description {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.3;
      min-height: 2.6em;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>Tap Tempo Pro</h1>
    </header>

    <div id="canvas-wrapper">
      <canvas id="tapCanvas"></canvas>
    </div>

    <div class="controls-panel">
      <div class="selector-label">Averaging Window</div>
      <div class="btn-group">
        <button class="btn" data-window="4">4 Taps</button>
        <button class="btn active" data-window="8">8 Taps</button>
        <button class="btn" data-window="16">16 Taps</button>
      </div>
      <div class="description" id="modeDescription">
        8 Taps: Balanced responsiveness and stability for general use.
      </div>
    </div>

    <footer>
      Press Spacebar or Tap Screen
    </footer>
  </div>
